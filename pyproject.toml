[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ladle-twin"
version = "0.1.0"
description = "Pure functions of the POD reduced-order models and the ladle digital twin notebooks"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
twin = ["scikit-learn", "torch", "pandas"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
